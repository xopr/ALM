<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo.svg" />
    <title>Tauri + Solid + Typescript App</title>
  </head>

  <body>
    <script type="application/javascript">
      window.addEventListener("load", () => {
        // Special case: in dev mode, the app does not initialize correctly (webiew issue?)
        if (!document.querySelector("#root").children.length) {
          const times = sessionStorage.getItem("reloadCount") ?? 0;
          if (times > 3) return;
          sessionStorage.setItem("reloadCount", `${times + 1}`);
          location.reload();
        }
      });
    </script>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <script src="/src/index.tsx" type="module"></script>
  </body>
</html>
